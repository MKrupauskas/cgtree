[package]
name = "cgtree"
version = "0.1.0"
edition = "2024"
# cgtree ships as a binary. The library target exists so the integration
# tests in `tests/` can drive the explorer; it is not a supported API.
publish = false

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"] }
ratatui = "0.30.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tui-input = "0.15"

[dev-dependencies]
tempfile = "3.27.0"
