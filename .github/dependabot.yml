version: 2
updates:
  # Keep the pinned action majors current; without this they silently rot.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      # One PR for routine patch/minor bumps instead of one per crate.
      minor-and-patch:
        update-types: [minor, patch]
